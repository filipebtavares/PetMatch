name: CI - Push

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'ci/**'

jobs:
  # Job 1: Compilação e execução de testes automatizados com cobertura
  build-and-test:
    name: Build & Test (Push)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Compilar projeto TypeScript
        run: npm run build

      - name: Executar testes com cobertura
        run: npm test

  # Job 2: Construção da imagem Docker (validação contínua em qualquer branch)
  build-docker:
    name: Build Docker Image
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagem Docker (sem push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/petmatch-backend:test

  # Job 3: Publicação da imagem no DockerHub (apenas na baseline: branch main)
  publish-docker:
    name: Publish to DockerHub
    needs: [build-and-test, build-docker]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir e publicar imagem no DockerHub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/petmatch-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/petmatch-backend:${{ github.sha }}
